<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lisa Mercer Dinner Party</title>

<style>
body{
    margin:0;
    padding:30px;
    background:#f2f2f2;
    font-family:Arial, sans-serif;
}

.invitation-box{
    max-width:700px;
    margin:auto;
    background:#ffffff;
    border:1px solid #ddd;
}

.header{
    background:#4d8fd8;
    color:white;
    text-align:center;
    padding:35px;
    margin:40px;
}

.header h1{
    margin:0;
    font-size:42px;
}

.header p{
    margin-top:10px;
    font-size:20px;
}

.content{
    text-align:center;
    padding:0 50px 60px;
}

.content h2{
    font-size:48px;
    color:#111;
    margin-bottom:30px;
}

.content p{
    font-size:28px;
    color:#666;
    line-height:1.6;
}

.rsvp-btn{
    display:inline-block;
    margin-top:25px;
    background:#4d8fd8;
    color:white;
    text-decoration:none;
    padding:18px 50px;
    font-size:26px;
    font-weight:bold;
    border-radius:4px;
}

.note{
    margin-top:35px;
    color:#999;
    font-size:18px;
}
</style>

</head>
<body>

<div class="invitation-box">

    <div class="header">
        <h1>You're Invited!</h1>
        <p>Join us for a special evening</p>
    </div>

    <div class="content">

        <h2>Shari Jarvis
 PARTY</h2>

        <p>
            We're delighted to invite you to a wonderful night filled
            with delicious food, great conversations, and memorable moments.
        </p>

        <a href="https://uyshi95-stack.github.io/invite/invite.html">View &amp; RSVP</a>

        <div class="note">
            Tap the button to confirm your attendance and see who's coming.
        </div>

    </div>

</div>

</body>
</html>
